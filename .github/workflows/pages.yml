name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache-bust local CSS/JS references
        # GitHub Pages' default Cache-Control lets browsers (especially
        # mobile) hold onto stale css/js across deploys, which has caused
        # real devices to run a stale stylesheet against fresh markup.
        # Appending the commit SHA as a query string on every local
        # css/js reference — including each ES module's own relative
        # imports — forces a genuinely fresh fetch on every deploy.
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=${SHA_SHORT}\"#g" index.html
          find js -name '*.js' -print0 | xargs -0 sed -i -E "s#(from|import) '(\./[^']+\.js)'#\1 '\2?v=${SHA_SHORT}'#g"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
